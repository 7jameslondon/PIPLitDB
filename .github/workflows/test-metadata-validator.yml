name: Test metadata validator

on:
  # This workflow is intentionally untrusted and is never the enforcement signal.
  pull_request:

permissions:
  contents: read

concurrency:
  group: metadata-validator-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-candidate:
    name: Test proposed metadata validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed pull request result
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/requirements-validation.txt

      - name: Install proposed validation dependencies
        id: candidate_install
        run: python -m pip install --requirement candidate/requirements-validation.txt

      - name: Exercise proposed validator against pull request result
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: >-
          python candidate/scripts/validate_metadata.py
          --root candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"

      - name: Test proposed metadata validator
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        working-directory: candidate
        run: python -m unittest discover --start-directory tests --verbose
