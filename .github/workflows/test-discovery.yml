name: Test paper discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "discovery/**"
      - "scripts/discovery/**"
      - "scripts/discover_papers.py"
      - "scripts/backtest_discovery.py"
      - "scripts/build_discovery_benchmark.py"
      - "scripts/prepare_discovery_handoff.py"
      - "scripts/publish_discovery.py"
      - "tests/discovery/**"
      - "requirements-discovery.txt"
      - ".github/workflows/discover-papers.yml"
      - ".github/workflows/test-discovery.yml"
      - ".github/workflows/validate-metadata-trusted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-discovery.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-discovery.txt

      - name: Run discovery and metadata tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Validate tracked discovery configuration
        run: >-
          python -c
          "from pathlib import Path; from scripts.discovery.config import load_exclusions, load_queries; load_queries(Path('discovery/queries.yaml')); load_exclusions(Path('discovery/exclusions.yaml'))"
