name: Discover PIP papers

on:
  schedule:
    - cron: "17 6 * * 0"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      from:
        description: Inclusive publication/posting start date (YYYY-MM-DD); leave both dates blank for six months
        required: false
        type: string
      until:
        description: Inclusive publication/posting end date (YYYY-MM-DD)
        required: false
        type: string
      source:
        description: Diagnostic source; choosing one forces read-only behavior
        required: true
        default: all
        type: choice
        options: [all, openalex, pubmed, crossref, arxiv]
      dry_run:
        description: Search and report without publishing
        required: true
        default: true
        type: boolean
      allow_partial:
        description: Report successful sources when another fails; always read-only
        required: true
        default: false
        type: boolean

concurrency:
  group: paper-discovery
  cancel-in-progress: false

jobs:
  discover-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      publication_allowed: ${{ steps.prepare.outputs.publication_allowed }}
      has_publish_work: ${{ steps.prepare.outputs.has_publish_work }}
      handoff_sha256: ${{ steps.prepare.outputs.handoff_sha256 }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    env:
      DISCOVERY_FROM: ${{ inputs.from || '' }}
      DISCOVERY_UNTIL: ${{ inputs.until || '' }}
      DISCOVERY_SOURCE: ${{ github.event_name == 'schedule' && 'all' || inputs.source }}
      DISCOVERY_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      DISCOVERY_ALLOW_PARTIAL: ${{ github.event_name == 'schedule' && 'false' || inputs.allow_partial }}
      DISCOVERY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DISCOVERY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      DISCOVERY_CONTACT_EMAIL: ${{ secrets.DISCOVERY_CONTACT_EMAIL }}
    steps:
      - name: Check out the latest default branch with complete history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture trusted base SHA
        id: base
        run: echo "DISCOVERY_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-discovery.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-discovery.txt

      - name: Discover, reconcile, deduplicate, and prepare bounded handoff
        id: prepare
        run: python scripts/prepare_discovery_handoff.py

      - name: Upload reports and data-only handoff
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: artifacts/discovery/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: discover-and-validate
    if: >-
      ${{
        needs.discover-and-validate.result == 'success' &&
        needs.discover-and-validate.outputs.publication_allowed == 'true' &&
        needs.discover-and-validate.outputs.has_publish_work == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: read
    env:
      DISCOVERY_HANDOFF: artifacts/discovery/handoff.json
      DISCOVERY_HANDOFF_SHA256: ${{ needs.discover-and-validate.outputs.handoff_sha256 }}
      DISCOVERY_PUBLISH_TOKEN: ${{ secrets.DISCOVERY_PUBLISH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted publisher code at captured base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.discover-and-validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download handoff as data only
        uses: actions/download-artifact@v5
        with:
          name: discovery-${{ github.run_id }}
          path: artifacts/discovery

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-discovery.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-discovery.txt

      - name: Revalidate handoff and create or resume one stable batch PR
        run: python scripts/publish_discovery.py
