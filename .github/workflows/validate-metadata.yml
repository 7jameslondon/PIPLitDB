name: Validate metadata

on:
  # Enforce metadata rules with workflow and validator code from the trusted base branch.
  pull_request_target:
  push:
    branches:
      - main
    paths:
      - "database/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-validation.txt"
      - ".github/workflows/validate-metadata.yml"
      - ".github/workflows/test-metadata-validator.yml"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: metadata-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run trusted metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          path: trusted

      - name: Publish pending trusted status on pull request head
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: "pending",
              context: "Validate metadata records",
              description: "Trusted metadata validation is running.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Resolve pull request merge content before validation
        id: pr_merge_before
        if: ${{ github.event_name == 'pull_request_target' }}
        working-directory: trusted
        run: >-
          python scripts/resolve_pr_merge.py
          --root .
          --pr-number "${{ github.event.pull_request.number }}"
          --expected-base "${{ github.event.pull_request.base.sha }}"
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Materialize verified pull request result as data only
        if: ${{ github.event_name == 'pull_request_target' && steps.pr_merge_before.outcome == 'success' }}
        run: |
          set -euo pipefail
          git clone --no-checkout --no-local trusted candidate
          git -C candidate fetch --no-tags origin "${{ steps.pr_merge_before.outputs.commit_sha }}"
          git -C candidate checkout --detach "${{ steps.pr_merge_before.outputs.commit_sha }}"

      - name: Fetch pushed branch's previous tip
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        working-directory: trusted
        run: >-
          git fetch --no-tags origin
          "${{ github.event.before }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trusted/requirements-validation.txt

      - name: Install trusted validation dependencies
        id: trusted_install
        run: python -m pip install --requirement trusted/requirements-validation.txt

      - name: Validate pull request with trusted validator
        id: trusted_validation
        if: ${{ !cancelled() && steps.trusted_install.outcome == 'success' && github.event_name == 'pull_request_target' }}
        run: |
          python trusted/scripts/validate_metadata.py \
            --root candidate \
            --rules-root trusted \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ steps.pr_merge_before.outputs.commit_sha }}" \
            --summary-title "Trusted metadata result"
          # Trusted code also verifies that proposed rule files remain present,
          # parseable, symlink-safe, and internally consistent.
          python trusted/scripts/validate_metadata.py \
            --root candidate \
            --require-artifact .github/CODEOWNERS \
            --require-artifact .github/workflows/validate-metadata.yml \
            --require-artifact .github/workflows/test-metadata-validator.yml \
            --require-artifact requirements-validation.txt \
            --require-artifact scripts/resolve_pr_merge.py \
            --require-artifact scripts/validate_metadata.py \
            --require-artifact tests/test_resolve_pr_merge.py \
            --require-artifact tests/test_validate_metadata.py \
            --summary-title "Candidate rules and enforcement artifacts"

      - name: Resolve pull request merge content after validation
        id: pr_merge_after
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request_target' && steps.pr_merge_before.outcome == 'success' }}
        working-directory: trusted
        run: >-
          python scripts/resolve_pr_merge.py
          --root .
          --pr-number "${{ github.event.pull_request.number }}"
          --expected-base "${{ github.event.pull_request.base.sha }}"
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Validate pushed result and summarize record changes
        if: ${{ !cancelled() && steps.trusted_install.outcome == 'success' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: >-
          python trusted/scripts/validate_metadata.py
          --root trusted
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
          --comparison direct

      - name: Validate complete database
        if: ${{ !cancelled() && steps.trusted_install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')) }}
        run: python trusted/scripts/validate_metadata.py --root trusted

      - name: Test trusted metadata validator
        if: ${{ !cancelled() && steps.trusted_install.outcome == 'success' && github.event_name != 'pull_request_target' }}
        working-directory: trusted
        run: python -m unittest discover --start-directory tests --verbose

      - name: Publish trusted status on pull request head
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request_target' }}
        uses: actions/github-script@v8
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_TREE_SHA: ${{ steps.pr_merge_before.outputs.tree_sha }}
          AFTER_TREE_SHA: ${{ steps.pr_merge_after.outputs.tree_sha }}
          BEFORE_RESOLUTION_OUTCOME: ${{ steps.pr_merge_before.outcome }}
          AFTER_RESOLUTION_OUTCOME: ${{ steps.pr_merge_after.outcome }}
          VALIDATION_OUTCOME: ${{ steps.trusted_validation.outcome }}
        with:
          script: |
            const expectedBase = process.env.EXPECTED_BASE_SHA;
            const expectedHead = process.env.EXPECTED_HEAD_SHA;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (
              pullRequest.state !== "open" ||
              pullRequest.base.sha !== expectedBase ||
              pullRequest.head.sha !== expectedHead
            ) {
              core.info("Skipping status from a superseded pull request run.");
              return;
            }

            const contentStable =
              process.env.BEFORE_RESOLUTION_OUTCOME === "success" &&
              process.env.AFTER_RESOLUTION_OUTCOME === "success" &&
              process.env.BEFORE_TREE_SHA !== "" &&
              process.env.BEFORE_TREE_SHA === process.env.AFTER_TREE_SHA;
            const validationPassed = process.env.VALIDATION_OUTCOME === "success";
            const state = contentStable && validationPassed ? "success" : "failure";
            const description = state === "success"
              ? `Validated merge tree ${process.env.AFTER_TREE_SHA.slice(0, 12)}.`
              : !contentStable
                ? "Pull request merge content changed during validation."
                : "Trusted metadata validation failed.";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedHead,
              state,
              context: "Validate metadata records",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
