name: Validate metadata

on:
  # Run on every PR so this workflow can safely be configured as a required check.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "database/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-validation.txt"
      - ".github/workflows/validate-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate metadata records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        id: install
        run: python -m pip install --requirement requirements-validation.txt

      - name: Test metadata validator
        run: python -m unittest discover --start-directory tests --verbose

      - name: Validate pull request result and summarize record changes
        # Keep structured findings and the change summary available when tests fail.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: >-
          python scripts/validate_metadata.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"

      - name: Validate pushed result and summarize record changes
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: >-
          python scripts/validate_metadata.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
          --comparison direct

      - name: Validate complete database
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')) }}
        run: python scripts/validate_metadata.py
