name: Temporary OpenAlex live dry run

on:
  push:
    branches:
      - agent/automated-paper-discovery
    paths:
      - ".github/workflows/test-openalex-live.yml"

permissions:
  contents: read

concurrency:
  group: temporary-openalex-live-dry-run
  cancel-in-progress: true

jobs:
  openalex-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-discovery.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-discovery.txt

      - name: Confirm the OpenAlex secret is available
        shell: bash
        run: |
          if [[ -z "${OPENALEX_API_KEY}" ]]; then
            echo "::error::OPENALEX_API_KEY repository secret is unavailable."
            exit 1
          fi

      - name: Run OpenAlex discovery without writing records
        run: python scripts/discover_papers.py --source openalex --dry-run

      - name: Upload the dry-run report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temporary-openalex-dry-run-${{ github.run_id }}
          path: artifacts/discovery/
          if-no-files-found: warn
          retention-days: 7
