needs_review:
  label: Needs review
  description: The record needs human review or additional metadata work.

metadata_complete:
  label: Metadata complete
  description: The required metadata is complete but has not yet been independently verified.

verified:
  label: Verified
  description: The record metadata has been checked against an authoritative source.

not_ready_for_extraction:
  label: Not ready for extraction
  description: The record or its source files have not passed the extraction-readiness checks and are not ready for extraction.

ready_for_extraction:
  label: Ready for extraction
  description: The record and its source files have passed the extraction-readiness checks and are ready for extraction.

extracted_approved:
  label: Extracted - Approved
  description: The record has a completed extraction that has been reviewed and approved.
