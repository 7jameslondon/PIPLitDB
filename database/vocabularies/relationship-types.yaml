is_preprint_of:
  label: Is preprint of
  description: This document is a preprint of the related publication.
  inverse: has_preprint

has_preprint:
  label: Has preprint
  description: This publication has the related preprint.
  inverse: is_preprint_of

is_preliminary_version_of:
  label: Is preliminary version of
  description: This document is a preliminary or abbreviated version of the related expanded publication.
  inverse: has_preliminary_version

has_preliminary_version:
  label: Has preliminary version
  description: This publication has the related preliminary or abbreviated version.
  inverse: is_preliminary_version_of

corrects:
  label: Corrects
  description: This document corrects the related document.
  inverse: is_corrected_by

is_corrected_by:
  label: Is corrected by
  description: This document is corrected by the related document.
  inverse: corrects

is_version_of:
  label: Is version of
  description: This document is another version of the related document.
  inverse: is_version_of
